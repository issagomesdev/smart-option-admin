name: smart-option-admin

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    # NÃO usar `env_file: .env` aqui — mesmo motivo documentado no backend
    # (smart-option/docker-compose.prod.yml): o Compose interpola `${...}`
    # também dentro de arquivos carregados por `env_file`. O `.env` é
    # montado como arquivo dentro do container; o Next.js (não `dotenv`,
    # diferente do backend) já carrega `.env`/`.env.production` do diretório
    # de trabalho nativamente.
    environment:
      NODE_ENV: production
      # Fixo para casar com o upstream "app:3000" hard-coded no Caddyfile —
      # nunca deixar um APP_PORT herdado de um ".env" de outro ambiente
      # quebrar o proxy silenciosamente (mesma decisão do backend).
      PORT: 3000
    # Publicada SEMPRE em 127.0.0.1, nunca em 0.0.0.0. O Docker escreve as próprias regras de
    # iptables e passa por cima do UFW: um mapeamento "3009:3000" deixaria o painel acessível em
    # http://IP-DA-VPS:3009 — sem TLS e contornando o proxy — com o `ufw status` continuando a
    # mostrar a porta como bloqueada.
    #
    # Só é necessária quando um proxy do host (Nginx/Traefik já existente na VPS) faz o
    # roteamento, cenário em que o serviço "caddy" abaixo não sobe. Com o Caddy deste compose,
    # ela é inofensiva: o tráfego entra pela rede interna, não por aqui.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./.env:/app/.env:ro
    networks:
      - internal

  # Reverse proxy + TLS. Substitui Nginx + Certbot: o próprio Caddy emite e
  # renova o certificado Let's Encrypt sozinho (desafio HTTP-01 na porta 80,
  # via o mesmo processo, sem container/cron separado) — não há passo de
  # "config HTTP temporária" nem edição deste arquivo no primeiro deploy.
  # DOMAIN/ACME_EMAIL vêm do ".env" (mesmo mecanismo de interpolação
  # `${...}` documentado no backend, smart-option/docker-compose.prod.yml).
  #
  # Opcional, atrás do profile "caddy": numa VPS que já hospeda outros projetos, 80/443
  # normalmente pertencem a um proxy do host (Nginx, Traefik) — e aqui há um agravante, porque o
  # backend traz o próprio Caddy no compose dele. Dois compose disputando as mesmas portas na
  # mesma máquina nunca funciona; sem o profile, este sobe só o "app" e o proxy existente
  # encaminha para `127.0.0.1:${APP_HOST_PORT}`, caso em que DOMAIN/ACME_EMAIL não são usadas.
  #
  #   VPS dedicada:  docker compose -f docker-compose.prod.yml --profile caddy up -d
  #   proxy do host: docker compose -f docker-compose.prod.yml up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados + estado da conta ACME — precisa ser um volume nomeado
      # persistente: perdê-lo faz o Caddy reemitir o certificado no próximo
      # boot, e o Let's Encrypt tem limite de emissões por domínio/semana.
      - smart_option_admin_caddy_data:/data
      - smart_option_admin_caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  smart_option_admin_caddy_data:
  smart_option_admin_caddy_config:
